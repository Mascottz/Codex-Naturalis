name: night; the checks hold

on:
  pull_request:
  push:
    branches: [main, "arena/**"]

jobs:
  referee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: make check
